name: Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read
  checks: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  backend:
    name: Backend Syntax And API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile backend Python files
        run: python -m compileall backend

      - name: Run backend API tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  dependency-vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python dependency scan (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Node dependency scan (npm audit)
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom-and-provenance:
    name: SBOM And Provenance
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - dependency-vulnerability-scan
      - secrets-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: sbom.cdx.json

  container-build-provenance:
    name: Container Build And Provenance
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container artifact
        run: |
          docker buildx build \
            --file backend/Dockerfile \
            --output type=docker,dest=backend-image.tar \
            backend

      - name: Build frontend container artifact
        run: |
          docker buildx build \
            --file frontend/Dockerfile \
            --output type=docker,dest=frontend-image.tar \
            frontend

      - name: Upload container artifacts
        uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: |
            backend-image.tar
            frontend-image.tar

      - name: Attest backend image artifact provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: backend-image.tar

      - name: Attest frontend image artifact provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: frontend-image.tar
