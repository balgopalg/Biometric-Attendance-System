openapi: 3.0.3
info:
  title: Biometric Face Attendance API (Full)
  version: 1.0.0
  description: |
    Exhaustive endpoint specification for the backend route surface.
    Includes all discovered routes from auth, admin, lecturer, student, and recognition blueprints.

servers:
  - url: http://localhost:5000
    description: Local development

tags:
  - name: Auth
  - name: AdminCourses
  - name: AdminPapers
  - name: AdminLecturers
  - name: AdminStudents
  - name: AdminJobs
  - name: AdminAudit
  - name: AdminAttendance
  - name: AdminEligibility
  - name: Lecturer
  - name: Student
  - name: Recognition

components:
  securitySchemes:
    jwtCookie:
      type: apiKey
      in: cookie
      name: access_token_cookie
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    GenericObject:
      type: object
      additionalProperties: true

    GenericList:
      type: array
      items:
        $ref: '#/components/schemas/GenericObject'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string

    SetPinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: '^[0-9]{4}$'

    StartSessionRequest:
      type: object
      required: [paper_id]
      properties:
        paper_id:
          type: string

    RecognizeFrameRequest:
      type: object
      required: [session_id, frame]
      properties:
        session_id:
          type: string
        frame:
          type: string
          description: data URL base64 image

    CommitSessionRequest:
      type: object
      required: [session_id, pin]
      properties:
        session_id:
          type: string
        pin:
          type: string
          pattern: '^[0-9]{4}$'

    AdjustSessionRequest:
      type: object
      required: [pin, student_ids]
      properties:
        pin:
          type: string
          pattern: '^[0-9]{4}$'
        student_ids:
          type: array
          items:
            type: string

    CreateStudentRequest:
      type: object
      required: [name, email, course_id]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        course_id:
          type: string
        department:
          type: string
        enrollment_year:
          type: integer
        mobile_no:
          type: string
        enrolled_papers:
          type: array
          items:
            type: string

    UpdateStudentRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        mobile_no:
          type: string
        roll_number:
          type: string
        reg_number:
          type: string
        course_id:
          type: string
        enrolled_papers:
          type: array
          items:
            type: string
        academic_year:
          type: string
        academic_session:
          type: string
        enrollment_year:
          type: integer
        current_semester:
          type: integer

    BulkPromoteRequest:
      type: object
      required: [student_ids]
      properties:
        student_ids:
          type: array
          items:
            type: string
        from_semester:
          type: integer

    FaceEnrollRequest:
      type: object
      required: [user_id, photo]
      properties:
        user_id:
          type: string
        photo:
          type: string
        dataset_photos:
          type: array
          items:
            type: string

    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          properties:
            database:
              type: string
            indexes_missing:
              type: array
              items:
                type: string
          additionalProperties: true

    AuthUser:
      type: object
      required: [_id, name, email, role, must_change_password]
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        department: { type: string }
        must_change_password: { type: boolean }

    LoginSuccessResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'

    LecturerPinStatusResponse:
      type: object
      required: [has_pin]
      properties:
        has_pin: { type: boolean }
        pin_last_set:
          type: string
          nullable: true

    LecturerPinGenerateResponse:
      type: object
      required: [pin, message]
      properties:
        pin:
          type: string
          pattern: '^[0-9]{4}$'
        message: { type: string }

    LecturerPaper:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        code: { type: string }
        course_id: { type: string }
        lecturer_id: { type: string }
        semester:
          type: integer
          nullable: true
        total_classes: { type: integer }
        course_name:
          type: string
          nullable: true
        course_code:
          type: string
          nullable: true
        course_status: { type: string }
        is_course_inactive: { type: boolean }
        academic_year:
          type: string
          nullable: true
        total_enrolled_students: { type: integer }
        enrolled_academic_sessions:
          type: array
          items: { type: string }
        enrolled_academic_session:
          type: string
          nullable: true
        enrolled_academic_session_label:
          type: string
          nullable: true
      additionalProperties: true

    LecturerSessionStartResponse:
      type: object
      required: [session_id, paper]
      properties:
        session_id: { type: string }
        paper:
          $ref: '#/components/schemas/LecturerPaper'
        started_at:
          type: string
          nullable: true

    RecognitionMatch:
      type: object
      properties:
        user_id: { type: string }
        name: { type: string }
        similarity: { type: number }
        confidence: { type: number }
      additionalProperties: true

    LecturerSessionRecognitionResponse:
      type: object
      required: [new_matches, faces_detected, candidates_count, threshold]
      properties:
        new_matches:
          type: array
          items:
            $ref: '#/components/schemas/RecognitionMatch'
        faces_detected: { type: integer }
        total_recognized:
          type: integer
          nullable: true
        candidates_count: { type: integer }
        threshold: { type: number }
        best_similarity_seen:
          type: number
          nullable: true
        saved_folder:
          type: string
          nullable: true
        original_path:
          type: string
          nullable: true
        face_paths:
          type: array
          items: { type: string }
          nullable: true

    RecognizedStudent:
      type: object
      required: [user_id, name, email]
      properties:
        user_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }

    LecturerRecognizedListResponse:
      type: object
      required: [students]
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/RecognizedStudent'

    LecturerSessionCommitResponse:
      type: object
      required: [message, students_marked, session_id, rollback_until]
      properties:
        message: { type: string }
        students_marked: { type: integer }
        session_id: { type: string }
        rollback_until: { type: string }

    SessionReviewCandidate:
      type: object
      required: [user_id, name, email]
      properties:
        user_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        is_present:
          type: boolean
          nullable: true

    LecturerSessionReviewResponse:
      type: object
      required: [session_id, present_students, candidates, editable, students_marked]
      properties:
        session_id: { type: string }
        paper:
          allOf:
            - $ref: '#/components/schemas/LecturerPaper'
          nullable: true
        present_students:
          type: array
          items:
            $ref: '#/components/schemas/RecognizedStudent'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SessionReviewCandidate'
        committed_at:
          type: string
          nullable: true
        rollback_until:
          type: string
          nullable: true
        editable: { type: boolean }
        students_marked: { type: integer }

    LecturerAdjustSessionResponse:
      type: object
      required: [message, review]
      properties:
        message: { type: string }
        review:
          $ref: '#/components/schemas/LecturerSessionReviewResponse'

    LecturerProgressPaperSummary:
      type: object
      properties:
        paper_id: { type: string }
        paper_name: { type: string }
        paper_code: { type: string }
        course_name:
          type: string
          nullable: true
        academic_year:
          type: string
          nullable: true
        classes_taken: { type: integer }
        attendance_marks: { type: integer }
        avg_attendance_per_class: { type: number }

    LecturerProgressSessionRow:
      type: object
      properties:
        session_id: { type: string }
        paper_id: { type: string }
        paper_name: { type: string }
        paper_code: { type: string }
        course_name:
          type: string
          nullable: true
        academic_year:
          type: string
          nullable: true
        timestamp:
          type: string
          nullable: true
        students_count: { type: integer }
        total_students: { type: integer }
        students:
          type: array
          items:
            $ref: '#/components/schemas/RecognizedStudent'
        rollback_until:
          type: string
          nullable: true
        editable: { type: boolean }

    LecturerProgressResponse:
      type: object
      required: [filters, summary, papers, per_paper, sessions]
      properties:
        filters:
          type: object
          properties:
            paper_id:
              type: string
              nullable: true
            from_date:
              type: string
              nullable: true
            to_date:
              type: string
              nullable: true
        summary:
          type: object
          required: [total_classes_taken, total_attendance_marks, average_attendance_per_class]
          properties:
            total_classes_taken: { type: integer }
            total_attendance_marks: { type: integer }
            average_attendance_per_class: { type: number }
        papers:
          type: array
          items:
            $ref: '#/components/schemas/LecturerPaper'
        per_paper:
          type: array
          items:
            $ref: '#/components/schemas/LecturerProgressPaperSummary'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/LecturerProgressSessionRow'

    StudentProfileResponse:
      type: object
      required: [student, profile, course_status, is_course_inactive, subjects, papers]
      properties:
        student:
          type: object
          required: [user_id, name, email]
          properties:
            user_id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
            department: { type: string }
        profile:
          type: object
          properties:
            reg_number: { type: string }
            academic_year: { type: string }
            current_semester:
              type: integer
              nullable: true
            course_id: { type: string }
        course:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/GenericObject'
        course_status: { type: string }
        is_course_inactive: { type: boolean }
        subjects:
          type: array
          items:
            type: object
            properties:
              paper_id: { type: string }
              paper_name: { type: string }
              paper_code: { type: string }
              semester:
                type: integer
                nullable: true
              total_classes: { type: integer }
        papers:
          type: array
          items:
            type: object
            properties:
              paper_id: { type: string }
              paper_name: { type: string }
              paper_code: { type: string }
              semester:
                type: integer
                nullable: true
              total_classes: { type: integer }

    StudentAttendanceSessionRow:
      type: object
      properties:
        session_id: { type: string }
        date: { type: string }
        date_time: { type: string }
        timestamp:
          type: string
          nullable: true
        status: { type: string }
        present: { type: boolean }
        students_marked: { type: integer }

    StudentAttendancePaperSummary:
      type: object
      properties:
        paper_id: { type: string }
        paper_name: { type: string }
        paper_code: { type: string }
        attended: { type: integer }
        total_classes: { type: integer }
        percentage: { type: number }
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/StudentAttendanceSessionRow'

    StudentPredictionsItem:
      type: object
      properties:
        paper_id: { type: string }
        paper_name: { type: string }
        paper_code: { type: string }
        current_percentage: { type: number }
        overall_attendance_percentage: { type: number }
        overall_attended_classes: { type: integer }
        overall_total_classes: { type: integer }
        classes_needed_for_75: { type: integer }
        safe_bunks_remaining: { type: integer }

    StudentExamEligibilityItem:
      type: object
      properties:
        paper_id: { type: string }
        paper_name: { type: string }
        paper_code: { type: string }
        attendance_percentage: { type: number }
        overall_attendance_percentage: { type: number }
        overall_attended_classes: { type: integer }
        overall_total_classes: { type: integer }
        eligible:
          type: boolean
          nullable: true
        status: { type: string }
        approval_source: { type: string }

    RecognitionFace:
      type: object
      properties:
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: integer }
        confidence: { type: number }

    RecognitionDetectResponse:
      type: object
      required: [faces]
      properties:
        faces:
          type: array
          items:
            $ref: '#/components/schemas/RecognitionFace'

    RecognitionIdentifyResponse:
      type: object
      required: [matches, faces_detected]
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/RecognitionMatch'
        faces_detected: { type: integer }

    AdminCourse:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        code: { type: string }
        department: { type: string }
        course_duration: { type: integer }
        status: { type: string }
      additionalProperties: true

    AdminPaper:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        code: { type: string }
        course_id: { type: string }
        lecturer_id:
          type: string
          nullable: true
        semester:
          type: integer
          nullable: true
        total_classes: { type: integer }
      additionalProperties: true

    AdminLecturer:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        department: { type: string }
        role: { type: string }
      additionalProperties: true

    AdminStudent:
      type: object
      properties:
        _id: { type: string }
        user_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        course_id: { type: string }
        reg_number: { type: string }
        roll_number: { type: string }
        academic_session: { type: string }
        current_semester:
          type: integer
          nullable: true
      additionalProperties: true

    PaginatedCoursesResponse:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminCourse' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    AdminCoursesListResponse:
      oneOf:
        - type: array
          items: { $ref: '#/components/schemas/AdminCourse' }
        - $ref: '#/components/schemas/PaginatedCoursesResponse'

    PaginatedPapersResponse:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPaper' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    AdminPapersListResponse:
      oneOf:
        - type: array
          items: { $ref: '#/components/schemas/AdminPaper' }
        - $ref: '#/components/schemas/PaginatedPapersResponse'

    PaginatedLecturersResponse:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminLecturer' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    AdminLecturersListResponse:
      oneOf:
        - type: array
          items: { $ref: '#/components/schemas/AdminLecturer' }
        - $ref: '#/components/schemas/PaginatedLecturersResponse'

    PaginatedStudentsResponse:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminStudent' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    AdminStudentsListResponse:
      oneOf:
        - type: array
          items: { $ref: '#/components/schemas/AdminStudent' }
        - $ref: '#/components/schemas/PaginatedStudentsResponse'

    AdminLecturerPapersResponse:
      type: object
      required: [assigned, all]
      properties:
        assigned:
          type: array
          items: { $ref: '#/components/schemas/AdminPaper' }
        all:
          type: array
          items: { $ref: '#/components/schemas/AdminPaper' }

    AdminTempPasswordResponse:
      type: object
      required: [temp_password]
      properties:
        temp_password: { type: string }

    AdminLecturerResetPinResponse:
      type: object
      required: [pin, message]
      properties:
        pin:
          type: string
          pattern: '^[0-9]{4}$'
        message: { type: string }

    AdminCreateStudentResponse:
      type: object
      required: [temp_password]
      properties:
        temp_password: { type: string }
        profile:
          allOf:
            - $ref: '#/components/schemas/GenericObject'
          nullable: true
      additionalProperties: true

    StudentOptionItem:
      type: object
      properties:
        _id: { type: string }
        user_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        reg_number: { type: string }
        roll_number: { type: string }
        academic_session: { type: string }
        course_id: { type: string }
        current_semester:
          type: integer
          nullable: true
        course_name:
          type: string
          nullable: true
        is_course_inactive: { type: boolean }

    AdminBulkPromoteResponse:
      type: object
      required: [message, promoted_count, skipped_count, skipped_max_semester_count, removed_papers_count]
      properties:
        message: { type: string }
        promoted_count: { type: integer }
        skipped_count: { type: integer }
        skipped_max_semester_count: { type: integer }
        removed_papers_count: { type: integer }

    AdminEnrollFaceResponse:
      type: object
      required: [message, faces_detected, dataset_saved_count]
      properties:
        message: { type: string }
        faces_detected: { type: integer }
        dataset_saved_count: { type: integer }
        dataset_warning:
          type: string
          nullable: true

    AdminUploadPhotoResponse:
      type: object
      required: [message, file_path, file_name]
      properties:
        message: { type: string }
        file_path: { type: string }
        file_name: { type: string }

    AdminTrainingQueuedResponse:
      type: object
      required: [message, job_id, status_url, requested_count]
      properties:
        message: { type: string }
        job_id: { type: string }
        status_url: { type: string }
        requested_count: { type: integer }

    AdminTrainSingleResponse:
      type: object
      required: [message, trained_embeddings, skipped_images, dataset_dir]
      properties:
        message: { type: string }
        trained_embeddings: { type: integer }
        skipped_images: { type: integer }
        dataset_dir: { type: string }

    AdminTrainBulkResponse:
      type: object
      required: [message, requested_count, success_count, failure_count, total_trained_embeddings, items]
      properties:
        message: { type: string }
        requested_count: { type: integer }
        success_count: { type: integer }
        failure_count: { type: integer }
        total_trained_embeddings: { type: integer }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        trainer:
          allOf:
            - $ref: '#/components/schemas/GenericObject'
          nullable: true

    AdminRebuildAllResponse:
      type: object
      required: [message, requested_count, success_count, failure_count, total_trained_embeddings, items]
      properties:
        message: { type: string }
        requested_count: { type: integer }
        success_count: { type: integer }
        failure_count: { type: integer }
        total_trained_embeddings: { type: integer }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        trainer:
          allOf:
            - $ref: '#/components/schemas/GenericObject'
          nullable: true

    BackgroundJob:
      type: object
      properties:
        job_id: { type: string }
        job_type: { type: string }
        status: { type: string }
        attempts: { type: integer }
        max_attempts: { type: integer }
      additionalProperties: true

    AdminCancelJobResponse:
      type: object
      required: [message, job]
      properties:
        message: { type: string }
        job:
          $ref: '#/components/schemas/BackgroundJob'

    AdminReplayJobResponse:
      type: object
      required: [message, job_id, status_url]
      properties:
        message: { type: string }
        job_id: { type: string }
        status_url: { type: string }

    DeadLetterJobItem:
      type: object
      properties:
        job_id: { type: string }
        job_type: { type: string }
        error: { type: string }
        attempts: { type: integer }
        max_attempts: { type: integer }
        retry_count: { type: integer }
      additionalProperties: true

    DeadLetterListResponse:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeadLetterJobItem' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    DeadLetterReplayBulkResponse:
      type: object
      required: [message, requested, replayed, skipped]
      properties:
        message: { type: string }
        requested: { type: integer }
        replayed: { type: integer }
        skipped: { type: integer }

    DeadLetterReplayFilteredResponse:
      type: object
      required: [message, matched, limit, requested, replayed, skipped]
      properties:
        message: { type: string }
        matched: { type: integer }
        limit: { type: integer }
        requested: { type: integer }
        replayed: { type: integer }
        skipped: { type: integer }

    AdminJobsMetricsResponse:
      type: object
      required: [jobs, queue]
      properties:
        jobs:
          type: object
          additionalProperties: true
        queue:
          type: object
          additionalProperties: true

    AdminCaptureFacesResponse:
      type: object
      required: [message, captured_count, dataset_folder]
      properties:
        message: { type: string }
        captured_count: { type: integer }
        dataset_folder: { type: string }

    AdminCourseReassignResponse:
      type: object
      required: [message, moved_students, moved_papers]
      properties:
        message: { type: string }
        from_course:
          $ref: '#/components/schemas/AdminCourse'
        to_course:
          $ref: '#/components/schemas/AdminCourse'
        moved_students: { type: integer }
        moved_papers: { type: integer }

    AuditLogItem:
      type: object
      properties:
        _id: { type: string }
        action: { type: string }
        performed_by: { type: string }
        actor_name: { type: string }
        actor_email: { type: string }
        timestamp: { type: string }
        details: { type: string }
        rollback_available: { type: boolean }
        rolled_back: { type: boolean }
      additionalProperties: true

    AuditLogsResponse:
